name: Release duynh OCI chart

on:
  push:
    tags:
      - "duynh-v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: helm-oci-duynh-${{ github.ref }}
  cancel-in-progress: false

env:
  CHART_DIR: charts/duynh

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.4

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 1.1.2 --verify=false

      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^duynh-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          chart_version="$(helm show chart "${CHART_DIR}" | awk '$1 == "version:" { print $2 }')"
          test "${GITHUB_REF_NAME#duynh-v}" = "${chart_version}"
          helm lint "${CHART_DIR}" --strict --kube-version 1.34.0
          helm unittest --strict "${CHART_DIR}"

      - name: Package chart
        run: helm package "${CHART_DIR}" --destination dist

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push and verify OCI chart
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${GITHUB_REF_NAME#duynh-v}"
          helm push "dist/duynh-${version}.tgz" "oci://ghcr.io/${owner}/charts"
          helm show chart "oci://ghcr.io/${owner}/charts/duynh" --version "${version}"
