name: Helm CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.chart }} / Helm ${{ matrix.helm-version }}
    runs-on: ubuntu-latest
    concurrency:
      group: helm-ci-${{ github.ref }}-${{ matrix.chart }}-${{ matrix.helm-version }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        chart: [charts/duynh]
        helm-version: [v3.21.4, v4.2.4]

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ matrix.helm-version }}

      - name: Install helm-unittest
        shell: bash
        run: |
          if helm version --short | grep -q '^v4'; then
            helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 1.1.2 --verify=false
          else
            helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 1.1.2
          fi

      - name: Lint
        run: helm lint "${{ matrix.chart }}" --strict --kube-version 1.34.0

      - name: Unit test
        run: helm unittest --strict "${{ matrix.chart }}"

      - name: Render default values
        run: helm template test "${{ matrix.chart }}" --namespace apps --kube-version 1.34.0 > /dev/null

      - name: Render EKS and Envoy Gateway example
        run: helm template orders-api "${{ matrix.chart }}" --namespace apps --kube-version 1.34.0 --values "${{ matrix.chart }}/examples/values-orders.yaml" > /dev/null

      - name: Package chart
        run: helm package "${{ matrix.chart }}" --destination dist
